[package]
name = "myna-card"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
description = "A library for accessing the Japanese Individual Number Card (個人番号カード) over PC/SC"
license = "MIT"
repository = "https://github.com/soltia48/myna-card"
keywords = ["smartcard", "pcsc", "iso7816", "mynumber", "jpki"]
categories = ["api-bindings", "authentication"]
# CI configuration is not part of the crate.
exclude = [".github/"]

# `transport::pcsc` and everything behind `verify` exist only with those features on, and the
# crate docs link to them. Document with everything on, which is what docs.rs should show.
[package.metadata.docs.rs]
all-features = true

[dependencies]
# AES-128-CBC, for the secure messaging of the 券面入力補助AP. Encryption only: that application
# delivers no CCS key, so there is no MAC to compute.
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", optional = true }
pcsc = { version = "2.9", optional = true }
# SHA-2 comes from `rsa::sha2` rather than a `sha2` entry of its own. The two have to agree on a
# `digest` version or `rsa::Pss::new::<Sha256>()` stops compiling, and taking sha2 from rsa is what
# keeps them in step: a sha2 that rsa cannot use is one cargo will not resolve.
rsa = { version = "0.9", optional = true, features = ["sha2"] }
thiserror = "2"
# `Certificate::inner` hands out an `x509_cert::Certificate`, so this version is part of this
# crate's own API. 0.3 brings its own `der`/`const-oid`/`spki` majors, which for now sit alongside
# the ones `rsa` 0.9 uses — nothing is passed between the two, only re-encoded bytes.
x509-cert = { version = "0.3", optional = true }

[features]
default = ["pcsc", "verify"]
# The PC/SC backend. Disable to use the crate with a transport of your own.
pcsc = ["dep:pcsc"]
# Signature verification. Pulls in an RSA implementation and SHA-2; turn it off if you only need
# to read the card and will check signatures elsewhere.
verify = ["dep:rsa", "dep:x509-cert"]
# Secure messaging with the 券面入力補助AP. Needs `verify` for the RSA it delivers the session key
# under, and adds an AES-128 implementation of its own.
sm = ["dep:aes", "dep:cbc", "verify"]
# Expose the in-memory test transport to downstream crates.
mock = []

# Every example talks to a reader, so none of them build without the PC/SC backend, and all but
# `list_readers` print certificate contents, which is behind `verify`. Without these, building
# with a subset of the features fails on the examples even though the library itself builds fine.
[[example]]
name = "dump_certificates"
required-features = ["pcsc", "verify"]

[[example]]
name = "list_readers"
required-features = ["pcsc"]

[[example]]
name = "read_card"
required-features = ["pcsc", "verify"]

[[example]]
name = "secure_messaging"
required-features = ["pcsc", "sm"]
